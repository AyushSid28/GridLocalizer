server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Browser hits same origin; nginx forwards to the api service.
    location ~ ^/(health|telemetry|incidents|sim|network|scheduled-outages|docs|openapi.json|redoc) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
